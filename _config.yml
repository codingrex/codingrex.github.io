name: Jingxi Chen
url: https://codingrex.github.io
baseurl: ""

# Used for the page's meta description and link previews.
description: >-
  Homepage of Jingxi Chen, a Ph.D. student at the University of Maryland, College Park,
  working on image, video, and world generative models, computational photography, and robotic vision.

# Header: one line per entry under the name.
positions:
  - Ph.D. student in Computer Science, University of Maryland, College Park
  - Research Intern at Google, Amazon, Dolby

tagline: >-
  My research focuses on image, video, and world generative models, computational photography, and robotic vision.

# Optional highlighted note under the tagline (markdown), e.g. job-market status.
# Leave empty to hide it.
job_note: >-
  I am on the job market for full-time research scientist/engineer roles in
  Image/Video Generation and World Models. Feel free to reach out.
  [ianchen@umd.edu](mailto:ianchen@umd.edu)

# Bio section (markdown).
bio: |
  Welcome! I am a Ph.D. student in the Computer Science Department at the University of Maryland,
  College Park, where I work with
  [Prof. Yiannis Aloimonos](https://robotics.umd.edu/clark/faculty/350/Yiannis-Aloimonos) and
  [Dr. Cornelia Fermüller](http://users.umiacs.umd.edu/~fer/) in the
  [Perception and Robotics Group](https://prg.cs.umd.edu/). I also work closely with
  [Prof. Christopher Metzler](http://www.cs.umd.edu/~metzler/).

  During my Ph.D., I have been a Student Researcher at Google Research, an Applied Scientist Intern
  at Amazon, and a Ph.D. Research Intern at Dolby Laboratories.

# Contact links
